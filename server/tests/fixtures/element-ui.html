<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>element-ui selectOption 测试</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    .block { margin: 20px 0; }
    .block > label { display: block; margin-bottom: 6px; font-weight: 600; }
    .tt-tree-select-dropdown .el-tree { min-width: 200px; max-height: 260px; overflow-y: auto; }
  </style>
</head>
<body>
  <h3>element-ui (Vue2) selectOption 测试页</h3>

  <div id="app">
    <div class="block">
      <label>el-select 下拉（自定义渲染，非原生 select）</label>
      <el-select v-model="city" placeholder="请选择城市" clearable>
        <el-option label="北京" value="beijing"></el-option>
        <el-option label="上海" value="shanghai"></el-option>
        <el-option label="广州" value="guangzhou"></el-option>
        <el-option label="深圳" value="shenzhen"></el-option>
      </el-select>
      <div>当前值：{{ city }}</div>
    </div>

    <div class="block">
      <label>el-select + el-tree 树形选择器（element-ui 无原生 TreeSelect，empty 槽内嵌树）</label>
      <el-select v-model="dept" placeholder="请选择部门" clearable popper-class="tt-tree-select-dropdown" ref="deptSelect">
        <el-tree
          slot="empty"
          :data="deptTree"
          node-key="value"
          default-expand-all
          @node-click="onDeptNodeClick">
        </el-tree>
      </el-select>
      <div>当前值：{{ dept }}</div>
    </div>

    <div class="block">
      <label>el-date-picker 日期选择器</label>
      <el-date-picker v-model="date" type="date" placeholder="选择日期" value-format="yyyy-MM-dd"></el-date-picker>
      <div>当前值：{{ date }}</div>
    </div>

    <div class="block">
      <label>el-date-picker 日期时间选择器（datetime，需确定按钮提交）</label>
      <el-date-picker v-model="dateTime" type="datetime" placeholder="选择日期时间" value-format="yyyy-MM-dd HH:mm:ss"></el-date-picker>
      <div>当前值：{{ dateTime }}</div>
    </div>

    <div class="block">
      <label>el-date-picker 日期范围选择器</label>
      <el-date-picker v-model="range" type="daterange" start-placeholder="开始日期" end-placeholder="结束日期" value-format="yyyy-MM-dd"></el-date-picker>
      <div>当前值：{{ range }}</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/index.js"></script>
  <script>
    new Vue({
      el: '#app',
      data() {
        return {
          city: '',
          date: '',
          dateTime: '',
          range: [],
          dept: '',
          deptTree: [
            {
              label: '总公司', value: 'hq',
              children: [
                {
                  label: '研发部', value: 'dev',
                  children: [
                    { label: '前端组', value: 'fe' },
                    { label: '后端组', value: 'be' },
                  ],
                },
                { label: '市场部', value: 'mkt' },
              ],
            },
          ],
        };
      },
      methods: {
        // 树节点点击 → 写入选中值并收起下拉（树节点非 el-option，不会自动关闭）
        onDeptNodeClick(data) {
          this.dept = data.label;
          this.$refs.deptSelect && this.$refs.deptSelect.blur();
        },
      },
    });
  </script>
</body>
</html>
